name: HomeReel
options:
  bundleIdPrefix: com.johnloring
  deploymentTarget:
    tvOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.58.0
targets:
  HomeReel:
    type: application
    platform: tvOS
    sources:
      - HomeReel
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    info:
      path: HomeReel/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: HomeReel connects to your media server, and to your TV to change its picture mode, on your home network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnloring.homereel
        INFOPLIST_KEY_CFBundleDisplayName: HomeReel
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "Fixtures/*"
  HomeReelTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: HomeReelTests
    dependencies:
      - target: HomeReel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnloring.homereel.tests
  HomeReelUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: HomeReelUITests
    dependencies:
      - target: HomeReel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnloring.homereel.uitests
schemes:
  HomeReel:
    build:
      targets:
        HomeReel: all
        HomeReelTests: [test]
        HomeReelUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomeReelTests
        - HomeReelUITests
