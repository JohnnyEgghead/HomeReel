# Secret scanner settings. Run: gitleaks git --no-banner .
[extend]
useDefault = true

[[allowlists]]
description = "Made-up Plex database ids (24 hex characters) in test data. Allows that exact shape, not whole folders, so a real token there is still found."
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{24}$''',
]
